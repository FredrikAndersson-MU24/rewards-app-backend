name: Deploy to Scaleway Container Registry

on:
  release:
    types: [ published ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Install NPM
        working-directory: frontend
        run: npm install

      - name: Build frontend with NPM
        working-directory: frontend
        run: npm run build

      - name: Build with Maven
        run: ./mvnw clean package -DskipTests

      - name: Get version
        id: version
        run: |
          VERSION=$(grep -A1 '<artifactId>chorely</artifactId>' pom.xml \
            | grep '<version>' \
            | sed 's/.*<version>\(.*\)<\/version>.*/\1/')
          echo "jar=target/chorely-$VERSION.jar" >> $GITHUB_OUTPUT

      - name: Login to Scaleway Container Registry
        uses: docker/login-action@v3
        with:
          username: nologin
          password: ${{ secrets.SCALEWAY_API_KEY }}
          registry: ${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}
      - name: Build the Docker image
        run: docker build . -t ${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}/chorely:latest
      - name: Push the Docker Image
        run: docker push ${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}/chorely:latest
